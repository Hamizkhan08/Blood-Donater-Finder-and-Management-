<!DOCTYPE html>
<html>
<head>
  <title>BloodConnect - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: url("{{ url_for('static', filename='1758447159096.jpg') }}") no-repeat center center fixed;
      background-size: cover;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

  <div class="flex-grow flex items-center justify-center w-full">
    <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8 max-w-sm w-full text-center">
      <div class="flex items-center justify-center mb-6">
        <img src="https://previews.123rf.com/images/ihorsvetiukha/ihorsvetiukha1809/ihorsvetiukha180900018/110431259-two-hands-donate-blood-world-blood-donor-day-concept-red-drop-symbol-of-volunteer-blood-donation.jpg" alt="Blood Drop Icon" class="h-10 w-10 mr-2 text-red-500">
      </div>
      <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back!</h2>
      <p class="text-gray-500 mb-8">Sign in to continue to your account.</p>

      <form method="POST" class="space-y-4">
        <div>
          <label for="email" class="sr-only">Email or username</label>
          <input type="email" name="email" id="email" placeholder="Email or username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-400 focus:border-transparent transition duration-200" required>
        </div>
        <div>
          <label for="password" class="sr-only">Password</label>
          <input type="password" name="password" id="password" placeholder="Password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-400 focus:border-transparent transition duration-200" required>
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-semibold py-3 rounded-lg hover:bg-red-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">Log In</button>
      </form>

      <p class="mt-6 text-sm text-gray-600">Don’t have an account? <a href="/register" class="text-red-600 hover:text-red-700 font-medium">Sign up</a></p>
    </div>
  </div>

  <!-- Bottom Interactive Bar -->
  <div class="w-full bg-white p-4 text-center text-sm text-gray-500 border-t border-gray-100 shadow-inner fixed bottom-0 left-0">
    &copy; 2025 BloodConnect. Saving Lives Together.
  </div>

</body>
</html>
