<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Blood - BloodConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous" rel="stylesheet"> <!-- Font Awesome -->
  <style>
    @keyframes ping-slow {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .animate-ping-slow {
      animation: ping-slow 3s cubic-bezier(0,0,0.2,1) infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-red-50 to-white min-h-screen flex items-center justify-center font-sans antialiased p-6">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full relative overflow-hidden transform transition-all duration-300 hover:scale-105">
    
    

    <!-- Decorative droplets -->
    <div class="absolute -top-10 -left-10 w-32 h-32 bg-red-100 rounded-full opacity-20 transform rotate-45"></div>
    <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-red-100 rounded-full opacity-20 transform -rotate-45"></div>

    <!-- Header -->
    <div class="text-center mb-6 relative z-10">
      <svg class="mx-auto h-14 w-14 text-red-600 mb-3 animate-ping-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h2 class="text-3xl font-extrabold text-gray-900 leading-tight">Request Blood</h2>
      <p class="text-gray-500 mt-1 text-md">Every request brings hope. Save a life today!</p>
    </div>

    <!-- Form -->
    <form method="POST" class="space-y-3 relative z-10">
      <!-- Name -->
      <div>
        <label for="name" class="sr-only">Your Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-user text-gray-400"></i>
          </div>
          <input type="text" name="name" id="name" placeholder="Your Name" required
                 class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 shadow-sm transition duration-200 text-base">
        </div>
      </div>

      <!-- Blood Group -->
      <div>
        <label for="blood_group" class="sr-only">Blood Group Needed</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-tint text-gray-400"></i>
          </div>
          <input type="text" name="blood_group" id="blood_group" placeholder="Blood Group Needed (e.g., A+, O-)" required
                 class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 shadow-sm transition duration-200 text-base">
        </div>
      </div>

      <!-- Location -->
      <div>
        <label for="location" class="sr-only">Location</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-map-marker-alt text-gray-400"></i>
          </div>
          <input type="text" name="location" id="location" placeholder="Location (City/Area)" required
                 class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 shadow-sm transition duration-200 text-base">
        </div>
      </div>

      <!-- Contact -->
      <div>
        <label for="contact" class="sr-only">Contact</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-phone-alt text-gray-400"></i>
          </div>
          <input type="text" name="contact" id="contact" placeholder="Contact Number" required
                 class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 shadow-sm transition duration-200 text-base">
        </div>
      </div>

      <!-- Message -->
      <div>
        <label for="message" class="sr-only">Additional Information</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pt-2.5 pl-3 flex items-start pointer-events-none">
            <i class="fas fa-comment-dots text-gray-400"></i>
          </div>
          <textarea name="message" id="message" placeholder="Additional Information (e.g., urgency, hospital name)" rows="3"
                    class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 shadow-sm transition duration-200 text-base"></textarea>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full bg-red-600 text-white p-3 rounded-lg font-semibold text-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition duration-200 transform hover:scale-105 shadow-md flex items-center justify-center space-x-2">
        <i class="fas fa-paper-plane"></i><span>Submit Request</span>
      </button>
    </form>

    <!-- Messages -->
    {% if success_message %}
      <p class="mt-4 text-center text-red-700 relative z-10">{{ success_message }}</p>
    {% endif %}
    {% if error %}
      <p class="mt-4 text-center text-red-500 relative z-10">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
