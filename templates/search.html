<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Donors - BloodConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-50 to-white min-h-screen font-sans flex items-center justify-center p-6">

  <!-- Search Section -->
  <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full backdrop-blur-lg relative">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-3xl font-extrabold text-red-600">Search Donors</h2>
    </div>

    <!-- Form -->
    <form method="POST" class="space-y-4">
      <div>
        <input type="text" name="blood_group" placeholder="Blood Group (e.g. A+)" required
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-base transition duration-200">
      </div>
      <div>
        <input type="text" name="location" placeholder="Location (City/Area)"
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-base transition duration-200">
      </div>

      <!-- Search Button -->
      <button type="submit"
              class="w-full flex items-center justify-center bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition duration-200 transform hover:scale-105 shadow-md">
        🔎 Search
      </button>
    </form>

    <!-- Results -->
    <div class="mt-8 relative z-10">
      {% if donors %}
        <h3 class="text-xl font-semibold mb-3 text-gray-800">Results:</h3>
        <ul class="space-y-3">
          {% for donor in donors %}
            <li class="border p-4 rounded-xl bg-red-50 shadow-sm hover:shadow-md transition duration-200">
              <strong class="text-red-600 text-lg">{{ donor.name }}</strong> ({{ donor.blood_group }}) <br>
              📍 <span class="text-gray-700 font-medium">Location:</span> {{ donor.location }} <br>
              📞 <span class="text-gray-700 font-medium">Contact:</span> {{ donor.contact }}
            </li>
          {% endfor %}
        </ul>
      {% elif donors is not none %}
        <p class="text-gray-500 italic text-center">No donors found.</p>
      {% endif %}
    </div>

  </div>

</body>
</html>
