<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | BloodConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased relative overflow-hidden">
  
  <!-- Glowing backdrop blobs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-red-600/20 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl"></div>

  <div class="bg-slate-900/90 border border-slate-800 p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full relative z-10 backdrop-blur-xl">
    
    <div class="text-center mb-8">
      <div class="h-16 w-16 bg-gradient-to-tr from-red-600 to-rose-500 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4 shadow-lg shadow-red-600/30">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Admin Command Portal</h1>
      <p class="text-slate-400 text-sm mt-1">Authorized administrator authentication required</p>
    </div>

    <!-- Flash Alerts -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for category, message in messages %}
            <div class="p-4 text-xs font-semibold rounded-xl flex items-center space-x-2 {% if category == 'danger' %}bg-red-500/20 text-red-300 border border-red-500/40{% elif category == 'success' %}bg-emerald-500/20 text-emerald-300 border border-emerald-500/40{% else %}bg-blue-500/20 text-blue-300 border border-blue-500/40{% endif %}">
              <i class="fas fa-triangle-exclamation text-base"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-5">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Username / Admin ID</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
            <i class="fas fa-user-shield"></i>
          </div>
          <input type="text" name="username" id="username" placeholder="admin@admin or admin" required
                 class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl focus:outline-none focus:border-red-500 text-white font-medium placeholder-slate-600 transition">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
            <i class="fas fa-lock"></i>
          </div>
          <input type="password" name="password" id="password" placeholder="••••••••" required
                 class="w-full pl-11 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl focus:outline-none focus:border-red-500 text-white font-medium placeholder-slate-600 transition">
        </div>
      </div>

      <button type="submit" class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold text-base rounded-2xl shadow-lg shadow-red-600/30 transition flex items-center justify-center space-x-2">
        <i class="fas fa-right-to-bracket"></i><span>Access Admin Dashboard</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
      Default Admin Login: <span class="text-slate-300 font-semibold">admin@admin</span> / <span class="text-slate-300 font-semibold">admin</span>
    </div>

  </div>

</body>
</html>
